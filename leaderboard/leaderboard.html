<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Leaderboard - Circus Racing</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Zalando+Sans+SemiExpanded:ital,wght@0,200..900;1,200..900&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/flag-icons/css/flag-icons.min.css"
        />
        <link rel="stylesheet" href="leaderboard.css" />
    </head>
    <body>
        <div class="leaderboard-grid">
            <div class="empty-cell"></div>
            <div class="grid-cell powered-by-container">
                <span class="text-kehnte">Kehnte</span>
                <span class="text-powered-by">Powered by <span class="text-circus-racing">Circus Racing</span></span>
            </div>
            <div class="empty-cell"></div>

            <div class="empty-cell"></div>
            <div class="circuit-header-container">
                <div class="grid-cell circuit-name" id="lb-location">Peregrine Circuit</div>
                <div class="grid-cell weather-icon" id="lb-weather-icon"></div>
            </div>
            <div class="empty-cell"></div>

            <div class="empty-cell"></div>
            <div class="setting-session-container">
                <div class="grid-cell session-type" id="lb-session">Practicing</div>
                <div class="grid-cell start-type" id="lb-start-type">Rolling Start</div>
            </div>
            <div class="empty-cell"></div>

            <div class="empty-cell"></div>
            <div class="grid-cell lap-container">
                LAP &nbsp;<span class="lap-current" id="lb-lap-current">0</span><span class="lap-total" id="lb-lap-total">/0</span>
            </div>
            <div class="empty-cell"></div>

            <div id="lb-pilots-container" style="display: contents"></div>
        </div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
        <script src="/socket.io/socket.io.js"></script>
        <script src="../icons.js"></script>
        <script src="leaderboard.js"></script>
    </body>
</html>
