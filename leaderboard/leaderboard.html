<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Leaderboard - Circus Racing</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Zalando+Sans+SemiExpanded:ital,wght@0,200..900;1,200..900&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/flag-icons/css/flag-icons.min.css"
        />
        <link rel="stylesheet" href="leaderboard.css" />
    </head>
    <body>
        <div class="leaderboard-grid">
            <div class="empty-cell"></div>
            <div class="grid-cell powered-by-container">
                <span class="text-kehnte">Kehnte</span>
                <span class="text-powered-by"
                    >Powered by
                    <span class="text-circus-racing">Circus Racing</span></span
                >
            </div>
            <div class="empty-cell"></div>

            <div class="empty-cell"></div>
            <div class="circuit-header-container">
                <div class="grid-cell circuit-name">PEREGRINE CIRCUIT</div>
                <div class="grid-cell weather-icon">
                    <svg
                        viewBox="0 0 24 24"
                        class="icon-svg"
                        fill="currentColor"
                    >
                        <path
                            d="M6.5 17.5C4.01472 17.5 2 15.4853 2 13C2 10.7412 3.66597 8.87103 5.85461 8.54471C6.39801 5.91897 8.74902 4 11.5 4C14.7397 4 17.4323 6.43859 17.9252 9.56306C20.2198 9.87325 22 11.8335 22 14.25C22 16.8734 19.8734 19 17.25 19H6.5V17.5Z"
                        />
                    </svg>
                </div>
            </div>
            <div class="empty-cell"></div>

            <div class="empty-cell"></div>
            <div class="setting-session-container">
                <div class="grid-cell session-type">Practicing</div>
                <div class="grid-cell start-type">Rolling Start</div>
            </div>
            <div class="empty-cell"></div>

            <div class="empty-cell"></div>
            <div class="grid-cell lap-container">
                LAP &nbsp;<span class="lap-current">3</span
                ><span class="lap-total">/3</span>
            </div>
            <div class="empty-cell"></div>

            <div class="grid-cell icon-cell status-fastest">
                <svg
                    width="20"
                    height="20"
                    viewBox="0 0 40 40"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <path
                        d="M20 40C30.9413 40 40 30.9217 40 20C40 9.05884 30.9608 0 20.0196 0C18.9805 0 18.4707 0.627452 18.4707 1.64706V9.23531C18.4707 10.0981 19.0588 10.7647 19.9019 10.7647C20.7648 10.7647 21.353 10.0981 21.353 9.23531V1.60785L19.9804 3.33334C29.2746 3.33334 36.6471 10.7451 36.6471 20C36.6471 29.255 29.255 36.6668 20 36.6668C10.7451 36.6668 3.31373 29.255 3.33334 20C3.35295 15.8628 4.82353 12.1177 7.29414 9.23531C7.88237 8.4706 7.92159 7.54904 7.27453 6.86275C6.62747 6.17649 5.54904 6.2353 4.82354 7.09806C1.84314 10.5882 0 15.1177 0 20C0 30.9217 9.07845 40 20 40Z"
                        fill="white"
                    />
                    <path
                        d="M23.1375 22.8238C24.6866 21.1965 24.3728 19.02 22.5101 17.7259L12.1375 10.4709C11.1571 9.78465 10.1375 10.8239 10.8238 11.7847L18.0592 22.1572C19.3728 24.02 21.5493 24.3533 23.1375 22.8238Z"
                        fill="white"
                    />
                </svg>
            </div>

            <div class="pilot-row">
                <div class="pilot-rank rank-first">1</div>
                <div class="team-color" style="background-color: #ffd54f"></div>
                <div class="pilot-infos">
                    <div class="pilot-country">
                        <span class="fi fi-fr fis"></span>
                    </div>
                    <div class="pilot-name">KEHNTE</div>
                </div>
                <div class="pilot-laps">3</div>
                <div class="pilot-chrono">00:00.000</div>
            </div>

            <div class="grid-cell icon-cell status-finished">
                <svg
                    width="30"
                    height="30"
                    viewBox="0 0 30 30"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <rect width="7.5" height="7.5" fill="white" />
                    <rect
                        x="7.5"
                        y="7.5"
                        width="7.5"
                        height="7.5"
                        fill="white"
                    />
                    <rect x="15" width="7.5" height="7.5" fill="white" />
                    <rect
                        x="22.5"
                        y="7.5"
                        width="7.5"
                        height="7.5"
                        fill="white"
                    />
                    <rect y="15" width="7.5" height="7.5" fill="white" />
                    <rect
                        x="7.5"
                        y="22.5"
                        width="7.5"
                        height="7.5"
                        fill="white"
                    />
                    <rect x="15" y="15" width="7.5" height="7.5" fill="white" />
                    <rect
                        x="22.5"
                        y="22.5"
                        width="7.5"
                        height="7.5"
                        fill="white"
                    />
                    <rect x="7.5" width="7.5" height="7.5" fill="black" />
                    <rect y="7.5" width="7.5" height="7.5" fill="black" />
                    <rect x="22.5" width="7.5" height="7.5" fill="black" />
                    <rect
                        x="15"
                        y="7.5"
                        width="7.5"
                        height="7.5"
                        fill="black"
                    />
                    <rect
                        x="7.5"
                        y="15"
                        width="7.5"
                        height="7.5"
                        fill="black"
                    />
                    <rect y="22.5" width="7.5" height="7.5" fill="black" />
                    <rect
                        x="22.5"
                        y="15"
                        width="7.5"
                        height="7.5"
                        fill="black"
                    />
                    <rect
                        x="15"
                        y="22.5"
                        width="7.5"
                        height="7.5"
                        fill="black"
                    />
                </svg>
            </div>
        </div>
    </body>
</html>
