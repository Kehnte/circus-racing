<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Circus Racing</title>
        <link rel="stylesheet" href="race-manager.css" />
    </head>

    <body>
        <h1>Circus Racing</h1>

        <div id="race-manager-section">
            <h2>Race</h2>
            <div id="race-settings">
                <div>
                    <label>Race name:</label>
                    <input type="text" id="setting-race-name" />
                    <label>Session:</label>
                    <select id="setting-session">
                        <option value="Practice">Practice</option>
                        <option value="Qualifying">Qualifying</option>
                        <option value="Race">Race</option>
                    </select>
                </div>
                <div>
                    <label>Weather:</label>
                    <select id="setting-weather">
                        <option value="Clear">Clear</option>
                        <option value="Cloudy">Cloudy</option>
                        <option value="Fog">Fog</option>
                        <option value="Rain">Rain</option>
                        <option value="Storm">Storm</option>
                        <option value="Snow">Snow</option>
                    </select>
                    <label>Start type:</label>
                    <select id="setting-start-type">
                        <option value="Grid Start">Grid start</option>
                        <option value="Rolling Start">Rolling start</option>
                    </select>
                    <span>Pilots: <span id="pilot-count">0</span></span>
                </div>
            </div>
            <br />
            <div class="race-controls">
                <label>Total Laps: </label>
                <input type="number" id="total-laps" value="3" min="1" />
                <button onclick="startRace()" id="btn-start">Start race</button>
                <button onclick="pauseRace()" id="btn-pause" disabled>
                    Pause race
                </button>
                <button onclick="endRaceManually()" id="btn-finish" disabled>
                    Finish race
                </button>
                <button onclick="resetRace()">Reset race</button>
                <button onclick="reloadPilots()">Reload pilots</button>
                <button onclick="toggleTeamManagement()">Toggle teams</button>
            </div>
            <br />
            <table border="1">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Pilot</th>
                        <th class="team-ext">Team</th>
                        <th>Laps</th>
                        <th>Lap Counter</th>
                        <th>Set Pos</th>
                        <th>Reorder</th>
                        <th>DNF</th>
                    </tr>
                </thead>
                <tbody id="race-list"></tbody>
            </table>
        </div>

        <hr />

        <div id="pilots-manager-section">
            <h2>
                Pilots <button onclick="resetPilots()">Reset pilots</button>
            </h2>
            <table border="1">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Nationality</th>
                        <th class="team-ext">Team</th>
                        <th>Ship</th>
                        <th>Controls</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="pilots-list"></tbody>
                <tfoot>
                    <tr>
                        <td>
                            <input
                                type="text"
                                id="pilot-name"
                                placeholder="Pilot name"
                            />
                        </td>
                        <td>
                            <input
                                type="text"
                                id="pilot-country"
                                placeholder="fr"
                                maxlength="2"
                                style="width: 40px"
                            />
                        </td>
                        <td class="team-ext">
                            <select id="pilot-team"></select>
                        </td>
                        <td><select id="pilot-ship"></select></td>
                        <td><select id="pilot-controls"></select></td>
                        <td>
                            <button type="button" onclick="addPilot()">
                                Add pilot
                            </button>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <hr id="teams-separator" />

        <div id="teams-manager-section">
            <h2>Teams <button onclick="resetTeams()">Reset teams</button></h2>
            <table border="1">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Acronym</th>
                        <th>Color</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="team-list"></tbody>
                <tfoot>
                    <tr>
                        <td>
                            <input
                                type="text"
                                id="name"
                                placeholder="Team name"
                                required
                            />
                        </td>
                        <td>
                            <input
                                type="text"
                                id="acronym"
                                maxlength="4"
                                placeholder="ACRO"
                                required
                            />
                        </td>
                        <td>
                            <input type="color" id="color" value="#3498db" />
                        </td>
                        <td>
                            <button type="button" onclick="addTeam()">
                                Add team
                            </button>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <hr />

        <div id="ships-manager-section">
            <h2>Ships <button onclick="resetShips()">Reset ships</button></h2>
            <table border="1">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Model</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="ships-list"></tbody>
                <tfoot>
                    <tr>
                        <td>
                            <input
                                type="url"
                                id="ship-img"
                                placeholder="Image URL"
                            />
                        </td>
                        <td>
                            <input
                                type="text"
                                id="ship-model"
                                placeholder="Model"
                            />
                        </td>
                        <td>
                            <button type="button" onclick="addShip()">
                                Add ship
                            </button>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <hr />

        <div id="controls-manager-section">
            <h2>
                Controls
                <button onclick="resetControls()">Reset controls</button>
            </h2>
            <table border="1">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Control Type</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="controls-list"></tbody>
                <tfoot>
                    <tr>
                        <td>
                            <input
                                type="url"
                                id="control-img"
                                placeholder="Image URL"
                            />
                        </td>
                        <td>
                            <input
                                type="text"
                                id="control-type"
                                placeholder="Control Type"
                            />
                        </td>
                        <td>
                            <button type="button" onclick="addControl()">
                                Add control
                            </button>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <hr />

        <div id="data-manager-section">
            <h2>Data</h2>
            <div>
                <button onclick="exportData()">Export all data (JSON)</button>
                <button onclick="importData()">Import data (JSON)</button>
                <button onclick="resetAllData()">Reset all data</button>
            </div>
            <input
                type="file"
                id="import-file-input"
                accept=".json"
                style="display: none"
                onchange="handleFileImport(event)"
            />
        </div>
        
        <script src="/socket.io/socket.io.js"></script>
        <script src="storage.js"></script>
        <script src="teams.js"></script>
        <script src="ships.js"></script>
        <script src="controls.js"></script>
        <script src="pilots.js"></script>
        <script src="race.js"></script>
        <script src="shortcuts.js"></script>
        <script src="data-manager.js"></script>
    </body>
</html>
