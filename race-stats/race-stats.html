<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Race Stats - Comparison</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Zalando+Sans+SemiExpanded:ital,wght@0,200..900;1,200..900&display=swap"
            rel="stylesheet"
        />

        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/flag-icons/css/flag-icons.min.css"
        />

        <link rel="stylesheet" href="race-stats.css" />
    </head>
    <body>
        <div class="race-stats">
            <div class="pos-box pilot-a-pos">1</div>

            <div class="pilot-infos pilot-a">
                <div class="pilot-name-wrapper">
                    <div class="pilot-country">
                        <span class="fi fi-fr fis"></span>
                    </div>
                    <div class="pilot-name">Kehnte</div>
                </div>
                <div class="pilot-team">Circus Racing</div>
            </div>

            <div class="ship-model pilot-a">Gladius</div>

            <div class="gap-block">
                <div class="current-gap">Current gap</div>
                <div class="time-difference">+00:00.00</div>
            </div>

            <div class="ship-model pilot-b">m50</div>

            <div class="pilot-infos pilot-b">
                <div class="pilot-name-wrapper">
                    <div class="pilot-name">Neoscris</div>
                    <div class="pilot-country">
                        <span class="fi fi-gb fis"></span>
                    </div>
                </div>
                <div class="pilot-team">Bernard Tapie Racing</div>
            </div>

            <div class="pos-box pilot-b-pos">2</div>
        </div>
    </body>
</html>
