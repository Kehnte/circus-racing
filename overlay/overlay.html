<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Circus Racing — Overlay</title>
        <link rel="stylesheet" href="overlay.css" />
    </head>

    <body>
        <!-- Race Panel -->
        <div class="race-panel">
            <div class="race-info">
                <div class="race-location">
                    <span class="race-name" id="ov-race-name">Race name</span>
                    <span class="location-sep">/</span>
                    <span class="race-location" id="ov-location">Location</span>
                    <span class="location-sep">/</span>
                    <span class="race-tod" id="ov-tod">Time of day</span>
                    <div class="race-meta">
                        <span class="race-session" id="ov-session"
                            >Session</span
                        >
                        <span class="meta-sep">/</span>
                        <span class="race-start" id="ov-start-type"
                            >Start type</span
                        >
                        <div class="laps-block">
                            <span class="laps-label">LAP</span>
                            <span class="laps-value" id="ov-laps">x</span>
                        </div>
                    </div>
                    <div class="standings">
                        <table id="overlay-table">
                            <tbody id="overlay-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- DNF Panel -->
        <div id="dnf-panel" style="display: none">
            <div id="dnf-pilot"></div>
            <div id="dnf-ship"></div>
            <img id="dnf-ship-img" src="" alt="Ship Image" />
            <div class="dnf-status-text">DNF</div>
        </div>

        <script src="overlay.js"></script>
    </body>
</html>
