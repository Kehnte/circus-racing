<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Circus Racing — Create account</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons/css/flag-icons.min.css" />

        <script type="importmap">
            {
                "imports": {
                    "@material/web/": "https://esm.run/@material/web/"
                }
            }
        </script>
        <script type="module">
            import "@material/web/all.js";
            import { styles as typescaleStyles } from "@material/web/typography/md-typescale-styles.js";
            document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
        </script>

        <link rel="stylesheet" href="pilot-app.css" />
        <script src="/shared/nav.js"></script>
    </head>

    <body>

        <main class="page-content">
            <div class="register-layout">

                <!-- ── Left column: required ── -->
                <div class="m3-card register-card">
                    <p class="md-typescale-title-large card-title">Create your pilot account</p>
                    <p class="md-typescale-body-medium" style="color: var(--md-sys-color-on-surface-variant); margin: 0 0 24px 0;">
                        Three fields and you're in. You can complete your profile anytime.
                    </p>

                    <div class="form-stack">
                        <md-outlined-text-field
                            id="field-displayName"
                            label="Display name *"
                            type="text"
                            autocomplete="off"
                            supporting-text="Shown on overlays and leaderboard"
                            style="width:100%"
                        ></md-outlined-text-field>

                        <md-outlined-text-field
                            id="field-email"
                            label="Email *"
                            type="email"
                            autocomplete="email"
                            style="width:100%"
                        ></md-outlined-text-field>

                        <md-outlined-text-field
                            id="field-password"
                            label="Password *"
                            type="password"
                            autocomplete="new-password"
                            style="width:100%"
                        ></md-outlined-text-field>

                        <md-outlined-text-field
                            id="field-passwordConfirm"
                            label="Confirm password *"
                            type="password"
                            autocomplete="new-password"
                            style="width:100%"
                        ></md-outlined-text-field>
                    </div>
                </div>

                <!-- ── Right column: optional ── -->
                <div class="m3-card register-card">
                    <p class="md-typescale-title-medium card-title" style="display:flex; align-items:center; gap:8px;">
                        <span>Optional — complete now or later</span>
                        <md-badge value=" " style="--md-badge-color: var(--md-sys-color-tertiary-container); --md-badge-label-color: var(--md-sys-color-on-tertiary-container);"></md-badge>
                    </p>

                    <div class="form-stack">
                        <!-- Country -->
                        <div class="country-row">
                            <md-outlined-select id="field-country" label="Country" style="flex:1">
                                <!-- Populated by JS -->
                            </md-outlined-select>
                            <div class="country-flag-preview" id="country-flag-preview">
                                <span class="fi fi-un"></span>
                            </div>
                        </div>

                        <!-- Avatar URL -->
                        <md-outlined-text-field
                            id="field-avatarUrl"
                            label="Avatar URL"
                            type="url"
                            autocomplete="off"
                            supporting-text="Direct link to an image (.png, .jpg, .webp…)"
                            style="width:100%"
                        ></md-outlined-text-field>

                        <md-divider></md-divider>

                        <!-- Team -->
                        <md-outlined-select id="field-teamId" label="Team" style="width:100%">
                            <md-select-option value="">None</md-select-option>
                        </md-outlined-select>

                        <!-- Vehicle -->
                        <md-outlined-select id="field-vehicleId" label="Vehicle" style="width:100%">
                            <md-select-option value="">None</md-select-option>
                        </md-outlined-select>

                        <!-- Controls -->
                        <md-outlined-select id="field-controlsId" label="Controls" style="width:100%">
                            <md-select-option value="">None</md-select-option>
                        </md-outlined-select>
                    </div>
                </div>

            </div>

            <!-- Error banner -->
            <div id="error-banner" class="error-banner" hidden>
                <span class="material-symbols-outlined" style="font-size:20px">error</span>
                <span id="error-text"></span>
            </div>

            <!-- Submit row -->
            <div class="submit-row">
                <md-filled-button id="btn-register" onclick="handleRegister()">
                    <span class="material-symbols-outlined" slot="icon">rocket_launch</span>
                    Create account
                </md-filled-button>
                <p class="md-typescale-body-small" style="color: var(--md-sys-color-on-surface-variant); margin:0">
                    * Required fields
                </p>
            </div>

        </main>

        <script src="register.js"></script>
    </body>
</html>
