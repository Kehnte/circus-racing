<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Race Event Updates</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Zalando+Sans+SemiExpanded:ital,wght@0,200..900;1,200..900&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/flag-icons/css/flag-icons.min.css"
        />
        <link rel="stylesheet" href="event-row.css" />
    </head>
    <body>
        <div class="event-row" data-status="fastest-lap">
            <div class="event-icon"></div>

            <div class="event-data">
                <div class="event-label"></div>
                <div class="pilot-infos">
                    <div class="pilot-name-wrapper">
                        <div class="pilot-country"></div>
                        <div class="pilot-name"></div>
                    </div>
                    <div class="pilot-team"></div>
                </div>
                <div class="ship-model"></div>
                <div class="event-chrono">—</div>
        </div>

        <script src="/socket.io/socket.io.js"></script>
        <script src="../icons.js"></script>
        <script src="event-row.js"></script>
    </body>
</html>
