<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circus Racing Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&family=Roboto+Mono&family=Material+Symbols+Outlined&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{ "imports": { "@material/web/": "https://esm.run/@material/web/" } }</script>
  <script type="module">
    import '@material/web/all.js';
    import { styles as typescaleStyles } from '@material/web/typography/md-typescale-styles.js';
    document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
  </script>
</head>
<body>

  <!-- Header -->
  <div class="app-header">
    <span class="app-title">Circus Racing Monitor</span>
    <div class="server-status">
      <div class="dot" id="server-dot"></div>
      <span id="server-label">connecting…</span>
    </div>
  </div>

  <!-- Mode -->
  <div class="card">
    <div class="card-title">Mode</div>
    <div class="mode-buttons">
      <button class="mode-btn active" id="btn-race" onclick="setMode('RACE')">Race</button>
      <button class="mode-btn" id="btn-record" onclick="setMode('RECORD')">Record</button>
    </div>
  </div>

  <!-- Status -->
  <div class="card">
    <div class="card-title">Position</div>
    <div class="coords">
      <div class="coord-item">
        <div class="coord-label">X</div>
        <div class="coord-value" id="pos-x">—</div>
      </div>
      <div class="coord-item">
        <div class="coord-label">Y</div>
        <div class="coord-value" id="pos-y">—</div>
      </div>
      <div class="coord-item">
        <div class="coord-label">Z</div>
        <div class="coord-value" id="pos-z">—</div>
      </div>
    </div>
    <div class="status-row">
      <span id="ocr-time">No reading yet</span>
      <span id="send-status"></span>
    </div>
  </div>

  <!-- Record controls (hidden in RACE mode) -->
  <div class="card" id="record-card" style="display:none">
    <div class="card-title">Record</div>
    <div class="record-fields">
      <md-outlined-text-field
        id="circuit-name"
        label="Circuit name"
        value="Circuit"
      ></md-outlined-text-field>
      <md-outlined-select id="circuit-type" label="Type">
        <md-select-option value="LOOP" selected>
          <div slot="headline">Loop</div>
        </md-select-option>
        <md-select-option value="POINT_TO_POINT">
          <div slot="headline">Point to point</div>
        </md-select-option>
      </md-outlined-select>
    </div>
    <div class="record-actions">
      <div class="record-btn-wrap">
        <md-filled-button id="btn-start" onclick="recordMark('start')">Start</md-filled-button>
        <span class="record-hint">Ctrl+Num1</span>
      </div>
      <div class="record-btn-wrap">
        <md-outlined-button id="btn-checkpoint" onclick="recordMark('checkpoint')">Checkpoint</md-outlined-button>
        <span class="record-hint">Ctrl+Num2</span>
      </div>
      <div class="record-btn-wrap">
        <md-filled-tonal-button id="btn-finish" onclick="recordMark('finish')">Finish</md-filled-tonal-button>
        <span class="record-hint">Ctrl+Num3</span>
      </div>
      <div class="record-btn-wrap">
        <md-outlined-button id="btn-cancel" onclick="recordMark('cancel')">Cancel</md-outlined-button>
        <span class="record-hint">Ctrl+Num4</span>
      </div>
    </div>
    <div class="trace-count" id="trace-count">0 points recorded</div>
  </div>

  <!-- Config -->
  <div class="card">
    <div class="config-toggle" onclick="toggleConfig()">
      <div class="card-title">Configuration</div>
      <span class="config-toggle-icon material-symbols-outlined" id="config-icon">expand_more</span>
    </div>
    <div class="config-fields" id="config-fields" style="display:none">
      <div class="token-wrap">
        <md-outlined-text-field
          id="cfg-token"
          label="Token"
          type="password"
        ></md-outlined-text-field>
        <md-icon-button onclick="toggleToken()">
          <span class="material-symbols-outlined" id="token-eye">visibility</span>
        </md-icon-button>
      </div>
      <md-outlined-text-field
        id="cfg-url"
        label="Server URL"
        type="url"
      ></md-outlined-text-field>
      <md-outlined-select id="cfg-monitor" label="Monitor"></md-outlined-select>
      <div id="cfg-checkpoint-section" style="display:none; flex-direction:column; gap:12px">
        <div class="field-row">
          <div>
            <div class="field-label">Save checkpoints</div>
            <div class="field-hint">Write each position to checkpoints.txt</div>
          </div>
          <md-switch id="cfg-checkpoint-save"></md-switch>
        </div>
        <md-outlined-text-field
          id="cfg-checkpoint-distance"
          label="Min distance between saves (m)"
          type="number"
          min="10"
          step="10"
        ></md-outlined-text-field>
      </div>
      <div class="config-save">
        <md-filled-icon-button onclick="saveConfig()">
          <md-icon>save</md-icon>
        </md-filled-icon-button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
