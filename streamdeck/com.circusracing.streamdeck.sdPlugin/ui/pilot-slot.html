<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="sdpi-components.js"></script>
</head>
<body>
  <sdpi-item label="Pilot slot (0–19)">
    <sdpi-textfield setting="slotIndex" placeholder="0"></sdpi-textfield>
  </sdpi-item>
  <sdpi-item label="Server URL">
    <sdpi-textfield setting="serverUrl" placeholder="http://192.168.1.X:3000" global></sdpi-textfield>
  </sdpi-item>
  <sdpi-item label="Device Token">
    <sdpi-password setting="apiToken" placeholder="Token from admin panel" global></sdpi-password>
  </sdpi-item>
</body>
</html>
